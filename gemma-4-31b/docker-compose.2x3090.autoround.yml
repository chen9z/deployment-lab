services:
  vllm:
    image: ${GEMMA4_VLLM_IMAGE:-ghcr.io/noonghunna/vllm-club3090:nightly-stable}
    container_name: ${CONTAINER_NAME:-vllm-gemma4-31b-autoround-2x3090}
    ports:
      - target: 8000
        published: ${PORT:-8003}
        protocol: tcp
        mode: host
    volumes:
      - "${MODEL_DIR:-../models/Intel/gemma-4-31B-it-int4-AutoRound}:/models/gemma-4-31b-autoround:ro"
      - "${DRAFT_MODEL_DIR:-../models/google/gemma-4-31B-it-assistant}:/models/gemma-4-draft:ro"
      - "./cache/torch_compile:/root/.cache/vllm/torch_compile_cache"
      - "./cache/triton:/root/.triton/cache"
      - "./patches/vllm-pr40391-rebased/model_executor/layers/attention/attention.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/attention/attention.py:ro"
      - "./patches/vllm-pr40391-rebased/v1/core/kv_cache_utils.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/kv_cache_utils.py:ro"
      - "./patches/vllm-pr40391-rebased/v1/kv_cache_interface.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/kv_cache_interface.py:ro"
      - "./patches/vllm-pr40391-rebased/v1/worker/gpu/attn_utils.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/attn_utils.py:ro"
      - "./patches/vllm-pr40391-rebased/v1/worker/gpu_model_runner.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu_model_runner.py:ro"
      - "./patches/vllm-pr40391-rebased/v1/worker/kv_cache_shape_utils.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/kv_cache_shape_utils.py:ro"
      - "./patches/vllm-club3090-compat/model_executor/layers/fused_moe/routed_experts_capturer.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/routed_experts_capturer.py:ro"
      - "./patches/vllm-gemma4-mtp-compat/config/speculative.py:/usr/local/lib/python3.12/dist-packages/vllm/config/speculative.py:ro"
      - "./patches/vllm-gemma4-tool-parser-fixes/tool_parsers/gemma4_tool_parser.py:/usr/local/lib/python3.12/dist-packages/vllm/tool_parsers/gemma4_tool_parser.py:ro"
      - "./patches/vllm-pr41800-truncate-prompt-tokens/install.sh:/etc/club3090/install-pr41800.sh:ro"
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=1,2
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=1,2
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_NO_USAGE_STATS=1
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,max_split_size_mb:256,max_non_split_rounding_mb:1024}
      - TRITON_CACHE_DIR=/root/.triton/cache
      - VLLM_MARLIN_USE_ATOMIC_ADD=${VLLM_MARLIN_USE_ATOMIC_ADD:-1}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        if ! python3 - <<'PY' >/dev/null 2>&1
        from transformers import AutoConfig
        AutoConfig.from_pretrained("/models/gemma-4-draft", trust_remote_code=False)
        PY
        then
          pip install --quiet --upgrade transformers==5.8.0
        fi
        bash /etc/club3090/install-pr41800.sh
        exec vllm serve "$@" --disable-custom-all-reduce
      - --
    shm_size: "16gb"
    ipc: host
    restart: unless-stopped
    gpus:
      - driver: nvidia
        device_ids: ["1", "2"]
        capabilities: [gpu]
    command: >
      /models/gemma-4-31b-autoround
      --served-model-name ${SERVED_MODEL_NAME:-gemma-4-31b-autoround}
      --quantization auto_round
      --dtype ${DTYPE:-bfloat16}
      --tensor-parallel-size 2
      --kv-cache-dtype ${KV_DTYPE:-int8_per_token_head}
      --max-model-len ${MAX_MODEL_LEN:-98304}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.94}
      --max-num-seqs ${MAX_NUM_SEQS:-4}
      --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-4096}
      --speculative-config '{"model":"/models/gemma-4-draft","num_speculative_tokens":${SPEC_N_MAX:-3}}'
      --trust-remote-code
      --enable-prefix-caching
      --enable-chunked-prefill
      --enable-auto-tool-choice
      --reasoning-parser gemma4
      --tool-call-parser gemma4
      --chat-template /vllm-workspace/examples/tool_chat_template_gemma4.jinja
      --generation-config auto
      --override-generation-config '{"temperature":1.0,"top_p":0.95,"top_k":64}'
      --disable-uvicorn-access-log
      --no-use-tqdm-on-load
      --host 0.0.0.0
      --port 8000
