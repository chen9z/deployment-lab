services:
    vllm:
        image: ${QWEN36_VLLM_IMAGE:-vllm/vllm-openai:nightly-rollback-20260516}
        container_name: vllm-qwen36-27b
        ports:
            - "8001:8001"
        volumes:
            - ../models/Lorbus/Qwen3.6-27B-int4-AutoRound:/models/qwen36-27b:ro
            - ./qwen3.5-enhanced.jinja:/chat-template/qwen3.5-enhanced.jinja:ro
            - ./cache/torch_compile:/root/.cache/vllm/torch_compile_cache
            - ./cache/triton:/root/.triton/cache
        environment:
            - HF_HOME=/root/.cache/huggingface
            - CUDA_DEVICE_ORDER=PCI_BUS_ID
            - CUDA_VISIBLE_DEVICES=1
            - OMP_NUM_THREADS=4
            - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
            - NVIDIA_VISIBLE_DEVICES=1
            - VLLM_WORKER_MULTIPROC_METHOD=spawn
            - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
            - VLLM_NO_USAGE_STATS=1
            - VLLM_FLOAT32_MATMUL_PRECISION=high
            - VLLM_USE_FLASHINFER_SAMPLER=1
            - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
            - VLLM_MARLIN_USE_ATOMIC_ADD=${QWEN36_VLLM_MARLIN_USE_ATOMIC_ADD:-1}
            - TRITON_CACHE_DIR=/root/.triton/cache
            - CUDA_DEVICE_MAX_CONNECTIONS=8
            - NCCL_CUMEM_ENABLE=0
            - NCCL_P2P_DISABLE=1
        ipc: host
        shm_size: "16gb"
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          device_ids: ["1"]
                          capabilities: [gpu]

        command: >
            /models/qwen36-27b
            --tensor-parallel-size 1
            --max-model-len 262144
            --quantization auto_round
            --skip-mm-profiling
            --kv-cache-dtype fp8_e4m3
            --gpu-memory-utilization 0.93
            --max-num-seqs 4
            --max-num-batched-tokens 4128
            --enable-chunked-prefill
            --performance-mode interactivity
            --enable-prefix-caching
            --attention-backend FLASHINFER
            --served-model-name Qwen3.5-27B
            --chat-template /chat-template/qwen3.5-enhanced.jinja
            --host 0.0.0.0 --port 8001
            --disable-uvicorn-access-log
            --reasoning-parser qwen3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_coder
            --limit-mm-per-prompt.video 0
            --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
            --async-scheduling
            --generation-config auto
            --override-generation-config '{"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
